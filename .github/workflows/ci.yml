name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 37
          target: google_apis
          build-tools: 37.0.0
          accept-licenses: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Static analysis and architecture checks
        run: ./gradlew detekt ktlintCheck checkArchitecture --stacktrace

      - name: Unit tests
        run: ./gradlew :domain:test :data:test :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
